# RealSense + Isaac ROS Visual SLAM (release-3.2) — single source of truth.
#
# Edit this file on the host (ros2_ws/src/nectar-sdk/...) or inside the Isaac
# container at:
#   /workspaces/isaac_ros-dev/src/nectar-sdk/nectar/nectar/control/localization/config/vslam_realsense.yaml
# then restart nectar-vslam
#
# SLAM remaps infra1/infra2 (+ IMU). RGB is for detection/AI only
# (/camera/color/...). Emitter must stay off for cuVSLAM on RealSense.

/camera/camera:
  ros__parameters:
    enable_infra1: true
    enable_infra2: true
    enable_color: true
    enable_depth: true
    align_depth.enable: true
    enable_gyro: true
    enable_accel: true
    gyro_fps: 200
    accel_fps: 200
    unite_imu_method: 2
    enable_sync: false
    tf_publish_rate: 0.0
    depth_module:
      emitter_enabled: 0
      profile: "640x360x90"
    # rgb_camera.profile omitted → realsense-ros 4.51.1 default "0,0,0"
    # (device picks; often 1280x720x30 on D435i). Not rgb_camera.color_profile (4.x).

/visual_slam_node:
  ros__parameters:
    enable_image_denoising: true
    rectified_images: true
    enable_localization_n_mapping: true
    enable_imu_fusion: true
    # isaac_ros_visual_slam default
    sync_matching_threshold_ms: 5.0
    gyro_noise_density: 0.000244
    gyro_random_walk: 0.000019393
    accel_noise_density: 0.001862
    accel_random_walk: 0.003
    calibration_frequency: 200.0
    image_jitter_threshold_ms: 22.0
    imu_jitter_threshold_ms: 10.0
    base_frame: "camera_link"
    imu_frame: "camera_gyro_optical_frame"
    enable_slam_visualization: false
    enable_landmarks_view: false
    enable_observations_view: false
    verbosity: 0
    enable_debug_mode: false
    enable_ground_constraint_in_odometry: false
    enable_ground_constraint_in_slam: false
    camera_optical_frames:
      - "camera_infra1_optical_frame"
      - "camera_infra2_optical_frame"
